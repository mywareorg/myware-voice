# The native runtime hippo-dictate loads at run time. Pinned exactly: the C struct
# layouts below this version do not match, and Parakeet TDT v3 needs >= 1.12.15.
# Never bump without re-checking `size_of` in src/sherpa/mod.rs.
version = "1.13.8"

# Linux ships binaries named for the C API, with onnxruntime resolved by the
# shared object's own $ORIGIN rpath.
[linux]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared.tar.bz2"
sha256 = "c0bdb7907d3a74bba1d55d22bf4d9fa75586cf1530614ebe88a27b9118e015c4"
archive = "sherpa-onnx-v1.13.8-linux-x64-shared"

# Windows publishes only the MD-Release variant: 6.6 MB, a flattened `lib/` with
# no headers, and no bzip2 support in the built-in tar. Both DLLs plus the
# providers shim must sit beside the executable: Windows resolves a DLL's imports
# from the application directory, not from the DLL's own.
[windows]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-win-x64-shared-MD-Release-no-tts-lib.tar.bz2"
sha256 = "b90992b888710715d613a4fedcd75d5b4db294ef64f3194e4f77ea0a8b387441"
archive = "sherpa-onnx-v1.13.8-win-x64-shared-MD-Release-no-tts-lib"

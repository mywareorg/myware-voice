[package]
name = "hippo-dictate-settings"
version = "0.2.0"
edition = "2021"
description = "Settings window for hippo-dictate."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-dictate"

[[bin]]
name = "hippo-dictate-settings"
path = "src/main.rs"

[dependencies]
# The config file is the contract between this window and the daemon; it is the
# only reason this binary depends on the daemon crate, and it never talks to the
# running daemon over its socket.
hippo-dictate = { path = ".." }
# Pinned to a commit, not `branch = "main"`: the settings window is a separate
# binary that no test builds, so a moving branch breaks it silently. Bump the
# rev deliberately, with the build checked.
hippo-ui = { git = "https://gitlab.com/librewarelive/hippo-ui", rev = "a20f31b9c51b9ea1894f7500f4751bb9b91b0440", features = ["serde"] }
iced = { version = "0.13", features = ["tokio", "advanced", "image-without-codecs"] }
# The window icon and the header mark arrive as PNG; decode them once rather
# than enabling every codec iced would pull for `image`.
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"
# Editing the config in place: `toml` writes a whole document and cannot carry
# comments or keys this window does not know about, which would silently drop a
# hand-edit. Already in the tree (via `toml`), so this adds no download.
toml_edit = "0.22"

[[bin]]
name = "hippo-dictate-overlay"
path = "src/bin/overlay/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# The listening popup draws its own layer-shell surface: any ordinary window
# would take focus, and a focused overlay breaks the paste it exists to show.
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-client = "0.31"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

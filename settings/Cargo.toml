[package]
name = "hippo-voice-settings"
version = "0.1.0"
edition = "2021"
description = "Settings window for hippo-voice."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-voice"

[[bin]]
name = "hippo-voice-settings"
path = "src/main.rs"

[dependencies]
# The config file is the contract between this window and the daemon; it is the
# only reason this binary depends on the daemon crate, and it never talks to the
# running daemon over its socket.
hippo-voice = { path = ".." }
hippo-ui = { git = "https://gitlab.com/librewarelive/hippo-ui", branch = "main", features = ["serde"] }
iced = { version = "0.13", features = ["tokio", "advanced", "image-without-codecs"] }
# The window icon and the header mark arrive as PNG; decode them once rather
# than enabling every codec iced would pull for `image`.
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Two jobs, because they prove different things.
#
# `check` compiles every workspace member on the host: formatting, lints, and the
# settings window, which no test builds and which would otherwise rot against its
# `myware-ui` sibling. `settings/Cargo.toml` depends on that crate by path, so every
# job clones the sibling repo before cargo runs; a checkout on its own cannot
# resolve the manifest. It also type-checks the Windows target, which catches
# `cfg(windows)` code that the GNU cross-build links but a MSVC user would hit
# first. `check` does not link, so the missing linker on a Linux runner does not
# matter, and `build.rs` is a no-op off Windows by design.
#
# `linux-release` builds what a sway user actually installs: both binaries, the
# settings window, the sherpa runtime and the packaging, as one tarball. It is the
# only job that proves `install.sh` has something to find.
#
# `windows-cross` cross-builds the shipped Windows executable on a Linux runner.
# It does not repeat the host test run: `check` already ran the whole workspace.
#
# All Windows dependencies are pure Rust or windows-sys, so mingw can link the
# binary. What this proves: the Windows target compiles and links reproducibly,
# the ABI size assertions hold on the real target, and the resulting executable
# does not lean on the mingw runtime DLLs. What it cannot prove: that the sherpa
# DLLs load, that WASAPI capture works, or that SendInput reaches a window.
#
# Jobs run for merge requests, tags and the default branch. A push to `dev` costs
# nothing; the merge request is the gate.
stages:
  - check
  - build
  - package

.ci-rules: &ci-rules
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  before_script:
    - test -d ../myware-ui || git clone --depth 1 https://gitlab.com/mywareorg/myware-ui.git ../myware-ui

check:
  stage: check
  image: rust:1-bookworm
  interruptible: true
  rules: *ci-rules
  cache:
    key: cargo-registry
    paths:
      - /usr/local/cargo/registry/
  script:
    - apt-get update
    # The settings window pulls iced, which wants xkbcommon and the Wayland
    # client libraries at build time; cpal wants ALSA on the host.
    - apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
    - rustup component add rustfmt clippy
    - rustup target add x86_64-pc-windows-msvc
    - cargo fmt --all --check
    # `-D warnings` is the point: without it this job reports drift nobody acts on.
    - cargo clippy --workspace --all-targets -- -D warnings
    # Host tests, including the settings window's. It depends on `myware-ui` by
    # pinned rev rather than by branch, so this can only break when the rev is
    # bumped — which is when it should.
    - cargo test --workspace
    - cargo check -p myware-voice --target x86_64-pc-windows-msvc

linux-release:
  stage: build
  image: rust:1-bookworm
  interruptible: true
  rules: *ci-rules
  cache:
    key: cargo-registry
    paths:
      - /usr/local/cargo/registry/
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev bzip2 curl ca-certificates
    # The workspace: the tarball carries the settings window too, and the tray
    # launches it from the daemon's own directory.
    - cargo build --release --workspace --locked
    - ./scripts/fetch-sherpa.sh
    - version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
    - stage="dist/myware-voice-$version-linux-x64"
    - mkdir -p "$stage" "$stage/systemd"
    - cp target/release/myware-voice target/release/myware-voice-daemon target/release/myware-voice-settings target/release/myware-voice-overlay "$stage/"
    # sherpa-onnx and onnxruntime stay together: $ORIGIN rpath.
    - cp -R vendor/sherpa/lib "$stage/lib"
    - cp -R packaging/hicolor "$stage/hicolor"
    - cp packaging/myware-voice.desktop packaging/PKGBUILD "$stage/"
    - cp packaging/systemd/myware-voice.service "$stage/systemd/"
    # install.sh looks for the binaries beside itself, which is how the extracted
    # folder is laid out; uninstall.sh and the docs come along for the ride.
    - cp scripts/install.sh scripts/uninstall.sh README.md LICENSE CONTRIBUTING.md models.lock models-streaming.lock sherpa.lock "$stage/"
    - tar -czf "dist/myware-voice-$version-linux-x64.tar.gz" -C dist "myware-voice-$version-linux-x64"
    - tar -tzf "dist/myware-voice-$version-linux-x64.tar.gz"
    # Extract it and install it, because a tarball that only lists its contents has
    # proved nothing. This would have caught a fourth binary the installer did not
    # know about, or a launcher whose Exec= was not absolute.
    - |
      tar -xzf "dist/myware-voice-$version-linux-x64.tar.gz" -C /tmp
      prefix=$(mktemp -d)
      /tmp/myware-voice-$version-linux-x64/install.sh --prefix "$prefix"
      test -x "$prefix/bin/myware-voice"
      test -x "$prefix/libexec/myware-voice/myware-voice-overlay"
      grep -q "^Exec=$prefix/libexec/myware-voice/myware-voice-settings$" \
        "$prefix/share/applications/myware-voice.desktop"
      # Sandboxed directories, so the runner's home is untouched and `doctor` reports
      # the runtime it installed rather than one on the image. The output is
      # asserted rather than the exit code: a missing model is a normal state on a
      # fresh machine, and doctor says so without failing.
      out=$(XDG_RUNTIME_DIR=$(mktemp -d) \
        XDG_STATE_HOME=$(mktemp -d) \
        XDG_DATA_HOME=$(mktemp -d) \
        XDG_CONFIG_HOME=$(mktemp -d) \
        "$prefix/bin/myware-voice" doctor 2>&1 || true)
      echo "$out"
      echo "$out" | grep -q "sherpa-onnx"
      echo "$out" | grep -q "$prefix/libexec/myware-voice/lib"
  artifacts:
    name: myware-voice-linux-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*.tar.gz
    expire_in: 30 days

windows-cross:
  stage: build
  image: rust:1-bookworm
  interruptible: true
  rules: *ci-rules
  variables:
    # Statically link the CRT, so the exe does not need libgcc_s_seh-1.dll or
    # libwinpthread-1.dll on the user's machine. Scoped to the cross target so
    # the host test run is unaffected.
    CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C target-feature=+crt-static"
    SHERPA: sherpa-onnx-v1.13.8-win-x64-shared-MD-Release-no-tts-lib
  cache:
    key: cargo-registry
    paths:
      - /usr/local/cargo/registry/
  script:
    - apt-get update
    # The host test run links cpal, which needs ALSA headers and pkg-config on
    # Linux; the cross build does not, because it targets WASAPI.
    - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 curl ca-certificates pkg-config libasound2-dev
    - rustup target add x86_64-pc-windows-gnu
    # Only the daemon crate: the settings window pulls iced and wgpu, which are
    # built by scripts/build-windows.ps1 on a real Windows machine instead.
    - cargo build --release -p myware-voice --target x86_64-pc-windows-gnu
    - curl -fSL --retry 3 -o "/tmp/$SHERPA.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$SHERPA.tar.bz2"
    - tar -xjf "/tmp/$SHERPA.tar.bz2" -C /tmp
    - mkdir -p dist
    - cp target/x86_64-pc-windows-gnu/release/myware-voice.exe dist/
    - cp target/x86_64-pc-windows-gnu/release/myware-voice-daemon.exe dist/
    # Only the C API and its ONNX Runtime dependencies. The cxx API is a separate
    # library the app never loads.
    - cp "/tmp/$SHERPA/lib/sherpa-onnx-c-api.dll" "/tmp/$SHERPA/lib/onnxruntime.dll" "/tmp/$SHERPA/lib/onnxruntime_providers_shared.dll" dist/
    - cp README.md LICENSE models.lock dist/
    - cp scripts/install.ps1 scripts/uninstall.ps1 dist/
    # Print the import table, then fail if the mingw runtime leaked in.
    - x86_64-w64-mingw32-objdump -p dist/myware-voice.exe | grep 'DLL Name'
    - |
      if x86_64-w64-mingw32-objdump -p dist/myware-voice.exe |
         grep -qiE 'DLL Name: (libgcc_s_seh-1|libwinpthread-1)\.dll'; then
        echo "unexpected mingw runtime dependency; +crt-static did not take" >&2
        exit 1
      fi
    - ls -l dist
  artifacts:
    name: myware-voice-windows-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/
    expire_in: 30 days

# Needs a Windows runner: `tags: [windows]`. It is manual because the cross-build
# above is the only job that can run on the Linux runners this project has, and a
# Windows job that nothing matches would otherwise sit pending in every pipeline.
#
# The package is signed with a self-signed certificate created on the runner, so
# it installs only where that certificate is trusted. A releasable MSIX needs a
# real code-signing certificate in a CI variable, which is a purchase decision.
windows-msix:
  stage: package
  tags:
    - windows
  before_script: []
  when: manual
  allow_failure: true
  interruptible: true
  script:
    - powershell -ExecutionPolicy Bypass -File .\scripts\package-msix.ps1
    - Get-ChildItem dist\*.msix, dist\*.msix.sha256 | Select-Object Name, Length
  artifacts:
    name: myware-voice-msix-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/*.msix
      - dist/*.msix.sha256
    expire_in: 30 days

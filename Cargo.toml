# The settings window lives in settings/ but is not a workspace member: it depends
# on hippo-ui by relative path, which does not exist in a clean clone or on CI.
# Build it with `cargo build --manifest-path settings/Cargo.toml`.
[workspace]
exclude = ["settings"]
resolver = "2"

[package]
name = "hippo-voice"
version = "0.1.0"
edition = "2021"
description = "Push-to-talk dictation: speak, and the transcript lands in the focused window."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-voice"

[lib]
name = "hippo_voice"
path = "src/lib.rs"

[[bin]]
name = "hippo-voice"
path = "src/main.rs"

# Console-free on Windows, for start-on-login.
[[bin]]
name = "hippo-voice-daemon"
path = "src/bin/daemon.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
hound = "3.5"
libloading = "0.8"
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
arboard = "3"
enigo = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1

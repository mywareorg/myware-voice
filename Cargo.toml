[workspace]
members = ["settings"]
resolver = "2"

[package]
name = "hippo-dictate"
version = "0.2.0"
edition = "2021"
# `cargo run` is the CLI; the Windows tray daemon is launched with
# scripts\run-windows.ps1 (or `cargo run --bin hippo-dictate-daemon`).
default-run = "hippo-dictate"
description = "Push-to-talk dictation: speak, and the transcript lands in the focused window."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-dictate"

[lib]
name = "hippo_dictate"
path = "src/lib.rs"

[[bin]]
name = "hippo-dictate"
path = "src/main.rs"

# Console-free on Windows, for start-on-login.
[[bin]]
name = "hippo-dictate-daemon"
path = "src/bin/daemon.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
# Licence verification, offline: the public key is baked in at build time and no
# request ever leaves the machine.
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
# Only for `licence keygen`, so issuing one does not need a second toolchain.
rand_core = { version = "0.6", features = ["getrandom"] }
hound = "3.5"
libloading = "0.8"
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
arboard = "3"
enigo = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1

[workspace]
members = ["settings"]
resolver = "2"

[package]
name = "hippo-voice"
version = "0.1.0"
edition = "2021"
# `cargo run` is the CLI; the Windows tray daemon is launched with
# scripts\run-windows.ps1 (or `cargo run --bin hippo-voice-daemon`).
default-run = "hippo-voice"
description = "Push-to-talk dictation: speak, and the transcript lands in the focused window."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-voice"

[lib]
name = "hippo_voice"
path = "src/lib.rs"

[[bin]]
name = "hippo-voice"
path = "src/main.rs"

# Console-free on Windows, for start-on-login.
[[bin]]
name = "hippo-voice-daemon"
path = "src/bin/daemon.rs"

[dependencies]
anyhow = "1"
# The shared sherpa-onnx integration: runtime loader, model packages, audio
# preparation. Pinned to a rev, never a branch: nothing changes underneath a
# shipping build.
hippo-sherpa = { git = "https://gitlab.com/librewarelive/hippo-sherpa", rev = "bee5bb516d967c5a15a5f00e3e7a56fd298a2471" }
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
# Licence verification, offline: the public key is baked in at build time and no
# request ever leaves the machine.
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
# Only for `licence keygen`, so issuing one does not need a second toolchain.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
arboard = "3"
enigo = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
